transactionPriority.title=Prioridad de transacciones de Oracle
transactionPriority.intro=Dos clientes, una cita: observe cómo una reserva de emergencia tiene prioridad sobre una reserva regular sin finalizar.
transactionPriority.controls=Probar la carrera de reservas
transactionPriority.instructions=Elija una cita disponible. Inicie una reserva regular para mantenerla durante {0} segundos o inicie directamente una reserva de emergencia. Durante una reserva regular, puede enviar una solicitud de emergencia para la misma cita y demostrar la prioridad. Espere el resultado y vuelva a intentarlo con una cita disponible.
transactionPriority.availableAppointments=Citas disponibles, en orden
