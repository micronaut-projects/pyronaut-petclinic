transactionPriority.regular=Reserva regular
transactionPriority.emergency=Reserva de emergencia
transactionPriority.result=Qué ocurrió
transactionPriority.appointment=Cita solicitada
transactionPriority.databaseStatus=Estado confirmado en la base de datos
transactionPriority.suggestion=Siguiente cita disponible
transactionPriority.how=Cómo demuestra esto Micronaut y Oracle
transactionPriority.explanation=Cada botón envía una solicitud independiente al endpoint /book con type=regular o type=emergency. El servidor la dirige al método @OracleTransactional correspondiente. LOW bloquea la cita y espera {0} segundos. HIGH solicita la misma fila. Con la configuración de Docker, Oracle puede hacer rollback de LOW después de que HIGH espere unos 3 segundos. LOW detecta el rollback cuando intenta realizar su actualización final.
transactionPriority.limitations=La cuenta atrás es aproximada; cada solicitud informa de su resultado solo después del commit o rollback. La espera de {0} segundos es exclusiva de esta demostración. Ambas transacciones tienen un tiempo de espera de 30 segundos. El restablecimiento está disponible cuando terminan las solicitudes.
transactionPriority.error=No se pudo confirmar el resultado de la reserva o la disponibilidad. Vuelva a cargar la página para comprobar la disponibilidad.
transactionPriority.noAvailable=No hay citas disponibles. Restablezca para volver a intentarlo.
transactionPriority.confirmed=Rollback de prioridad de Oracle confirmado. La reserva de emergencia se confirmó y la reserva regular se revirtió. Puede volver a intentarlo con otra cita si hay alguna disponible.
transactionPriority.emergencyPending=La reserva de emergencia se confirmó. La cita se eliminó de la lista de disponibles. La solicitud regular todavía debe informar de su resultado.
transactionPriority.emergencyWon=La reserva de emergencia se confirmó. La cita se eliminó de la lista de disponibles. Elija otra cita para continuar.
transactionPriority.regularWon=La reserva regular se confirmó. Una solicitud de emergencia posterior no puede sobrescribirla.
transactionPriority.taken=La cita solicitada ya estaba reservada. Elija otra cita disponible.
transactionPriority.working=Las solicitudes de reserva están en curso.
transactionPriority.timedOut=Una solicitud agotó el tiempo de espera o fue cancelada. Esto no confirma un rollback de prioridad de Oracle.
transactionPriority.countdown=Respuesta estimada de LOW en
transactionPriority.completing=Esperando el resultado de la reserva regular…
transactionPriority.finished=La solicitud regular ha terminado.
transactionPriority.outcome.NOT_STARTED=No iniciada
transactionPriority.outcome.RUNNING=Solicitud en curso…
transactionPriority.outcome.COMMITTED=Reserva confirmada.
transactionPriority.outcome.PRIORITY_ROLLED_BACK=Oracle revirtió esta reserva para una transacción de mayor prioridad.
transactionPriority.outcome.TAKEN=La cita ya está reservada.
transactionPriority.outcome.TIMED_OUT=Tiempo de espera agotado o solicitud cancelada; no se confirmó ningún rollback de prioridad.
