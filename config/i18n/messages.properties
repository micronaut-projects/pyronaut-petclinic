transactionPriority.title=Oracle Transaction Priority
transactionPriority.intro=Two customers, one appointment: see an emergency booking take priority over an unfinished regular booking.
transactionPriority.controls=Try the booking race
transactionPriority.instructions=Choose an available appointment. Start a regular booking to hold it for {0} seconds, or start an emergency booking directly. During a regular booking, you can send an emergency request for the same appointment to demonstrate priority. Wait for the result, then retry with an available appointment.
transactionPriority.availableAppointments=Available appointments, in order
transactionPriority.startLow=Start regular booking
transactionPriority.startHigh=Start emergency booking
transactionPriority.reset=Reset appointments
transactionPriority.ready=Choose an appointment to begin
transactionPriority.regular=Regular booking
transactionPriority.emergency=Emergency booking
transactionPriority.result=What happened
transactionPriority.appointment=Requested appointment
transactionPriority.databaseStatus=Committed database status
transactionPriority.suggestion=Next available appointment
transactionPriority.how=How this demonstrates Micronaut and Oracle
transactionPriority.explanation=Each button sends a separate request to the /book endpoint with type=regular or type=emergency. The server dispatches it to the corresponding @OracleTransactional method. LOW locks the appointment and pauses for {0} seconds. HIGH requests the same row. Oracle can roll LOW back after HIGH waits about 3 seconds. LOW discovers that rollback when it tries its final update.
transactionPriority.limitations=The countdown is approximate; each request reports its result only after commit or rollback. The {0}-second pause is for this showcase only. Both transactions have a 30-second transaction timeout. Reset is available after the requests finish.
transactionPriority.noAvailable=No appointments available. Reset to try again.
transactionPriority.error=The booking result or availability could not be confirmed. Reload the page to check availability.
transactionPriority.confirmed=Oracle priority rollback confirmed. The emergency booking committed and the regular booking rolled back. You can retry with another appointment if one is available.
transactionPriority.emergencyPending=The emergency booking committed. Its appointment was removed from the available list. The regular request still needs to report its outcome.
transactionPriority.emergencyWon=The emergency booking committed. Its appointment was removed from the available list. Choose another appointment to continue.
transactionPriority.regularWon=The regular booking committed. A later emergency request cannot overwrite it.
transactionPriority.taken=The requested appointment was already booked. Choose another available appointment.
transactionPriority.working=Booking requests are running.
transactionPriority.timedOut=A request timed out or was cancelled. This does not confirm an Oracle priority rollback.
transactionPriority.countdown=Estimated LOW response in
transactionPriority.completing=Waiting for the regular booking result…
transactionPriority.finished=Regular request finished.
transactionPriority.outcome.NOT_STARTED=Not started
transactionPriority.outcome.RUNNING=Request running…
transactionPriority.outcome.COMMITTED=Booking committed.
transactionPriority.outcome.PRIORITY_ROLLED_BACK=Oracle rolled back this booking for a higher-priority transaction.
transactionPriority.outcome.TAKEN=The appointment is already booked.
transactionPriority.outcome.TIMED_OUT=Timed out or cancelled; no priority rollback confirmed.
transactionPriority.outcome.FAILED=The booking result could not be confirmed.
