#:schema ../__pyronaut__/schemas/micronaut-application.schema.json

[micronaut.application]
name = 'pyronaut-petclinic'

[micronaut.executors.blocking]
type = 'CACHED'
virtual = false

[micronaut.views.jinja]
default-extension = '.jinja'

[micronaut.views]
folder = '.'

[micronaut.router.static-resources.default]
enabled = true
mapping = '/static/**'
paths = ['file:static']

[micronaut.views.react]
server-bundle-path = 'classpath:views/ssr-components.mjs'
client-bundle-url = '/static/client.js'

[micronaut.caches.vets]
expire-after-write = '60s'
maximum-size = 100

[datasources.default]
db-type = 'oracle'
driver-class-name = 'oracle.jdbc.OracleDriver'
schema-generate = 'NONE'
dialect = 'ORACLE'

[flyway.datasources.default]
enabled = true
