#:schema ./__pyronaut__/schemas/pyronaut-pyproject.schema.json

[project]
name = 'pyronaut-petclinic'
version = '0.1.0'

[build-system]
requires = ['setuptools', 'wheel', 'tomli']
build-backend = 'setuptools.build_meta'

[tool.pytest.ini_options]
# Embedded GraalPy cannot use pytest's default file-descriptor capture.
addopts = '--capture=sys'

[tool.setuptools]
package-dir.'' = 'src'
packages.find.where = ['src']

[tool.pyronaut.toolchain]
type = 'jvm'

[tool.pyronaut]
repositories = ['mavenCentral']

[tool.pyronaut.control-panel]
enabled = true

[tool.pyronaut.sources]
python = 'src'
python-test = 'tests'
java = 'src-java'
resources = 'config'
test-resources = 'tests-config'
additional-resources = ['views', 'static']

[tool.pyronaut.test-resources]
enabled = true
client-timeout = 180
additional-modules = ['jdbc-oracle-free', 'jdbc-postgresql', 'jdbc-mysql']

[tool.pyronaut.validation]
# This SDK schema expects an object; Test Resources requires a list of maps.
# Keep runtime initialization verified by the Oracle tests (PORT-027).
suppressions = ['test-resources.containers.oracle.copy-to-container']

[tool.pyronaut.dependencies]
boms = ['io.micronaut.data:micronaut-data-bom:5.2.3']
runtime = [
  'io.micronaut:micronaut-http-server-netty',
  'io.micronaut:micronaut-management',
  'io.micronaut.cache:micronaut-cache-caffeine',
  'io.micronaut.data:micronaut-data-jdbc',
  'io.micronaut.flyway:micronaut-flyway:8.1.1',
  'io.micronaut.serde:micronaut-serde-jackson',
  'io.micronaut.serde:micronaut-serde-oracle-jdbc-json',
  'io.micronaut.sql:micronaut-jdbc-hikari',
  'io.micronaut.validation:micronaut-validation',
  'io.micronaut.views:micronaut-views-jinjava',
  'com.oracle.database.jdbc:ojdbc17',
  'com.h2database:h2',
  'org.orbisgis:h2gis:2.2.5',
  'org.postgresql:postgresql',
  'com.mysql:mysql-connector-j',
  'org.flywaydb:flyway-database-oracle',
  'org.flywaydb:flyway-database-postgresql',
  'org.flywaydb:flyway-mysql',
  'io.micronaut.pyronaut:micronaut-pyronaut-logback'
]
development-runtime = [
  'io.micronaut.controlpanel:micronaut-control-panel-datasource'
]
build = [
  'io.micronaut:micronaut-context-python',
  'io.micronaut:micronaut-inject-python',
  'io.micronaut.data:micronaut-data-processor',
  'io.micronaut.serde:micronaut-serde-processor',
  'io.micronaut.validation:micronaut-validation-processor'
]
test = [
  'io.micronaut.pyronaut:micronaut-pyronaut-pytest',
  'io.micronaut.pyronaut:micronaut-pyronaut-requests',
  'io.micronaut.test:micronaut-test-junit5',
  'io.micronaut.testresources:micronaut-test-resources-jdbc-oracle-free'
]
