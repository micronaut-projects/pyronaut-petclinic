name: Pyronaut PetClinic

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYRONAUT_GIT_TOKEN: ${{ secrets.PYRONAUT_GIT_TOKEN || secrets.GH_TOKEN }}
      PYRONAUT_GIT_USERNAME: ${{ secrets.PYRONAUT_GIT_USERNAME || secrets.GH_USERNAME || 'x-access-token' }}
      GRAALVM_QUICK_BUILD: true
      ORG_GRADLE_PROJECT_pyronautNativeImageCiArgs: "--parallelism=1"
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - name: Check out PetClinic
        uses: actions/checkout@v6

      - name: Check out Pyronaut 0.0.x
        uses: actions/checkout@v6
        with:
          repository: micronaut-projects/pyronaut
          ref: 0.0.x
          path: pyronaut
          token: ${{ secrets.PYRONAUT_GIT_TOKEN || secrets.GH_TOKEN }}

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1.4.4
        with:
          distribution: graalvm
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up GraalPy virtual environment
        uses: ./pyronaut/.github/actions/setup-graalpy-pyenv
        with:
          graalpy-version: graalpy3.12-25.1.3
          pytest-version: '9.1.1'
          venv-dir: ${{ runner.temp }}/pyronaut-sdk-venv

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build native Pyronaut wheel
        working-directory: pyronaut
        run: ./gradlew :micronaut-pyronaut:buildSdkWheel -Pnative=true --no-daemon

      - name: Install Pyronaut wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyronaut/pyronaut/build/wheel/dist/pyronaut-*.whl
          pyronaut --version

      - name: Install project dependencies
        run: pyronaut install --refresh --progress off

      - name: Run PetClinic tests
        run: pyronaut test --no-validate
