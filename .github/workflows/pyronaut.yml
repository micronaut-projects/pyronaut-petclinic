name: Pyronaut PetClinic

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        database: [h2, oracle, postgres, mysql]
    env:
      PETCLINIC_TEST_DATABASE: ${{ matrix.database }}

    steps:
      - name: Check out PetClinic
        uses: actions/checkout@v6

      - name: Set up Pyronaut
        uses: micronaut-projects/setup-pyronaut@v1
        with:
          pytest-version: '9.1.1'

      - name: Install project dependencies
        run: pyronaut install --progress off

      - name: Run PetClinic tests
        run: pyronaut test
